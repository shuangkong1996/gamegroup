# Poker 前端 + game-server 反向代理配置示例
# 部署位置：/etc/nginx/conf.d/poker.conf（或站点目录）
#
# 说明：
# - 前端静态文件放在 /var/www/poker（即 poker/dist 构建产物）
# - /api 与 /api/ws 反代到 game-server（8080）
# - WebSocket 必须携带 Upgrade / Connection 头，否则 ws 连不上

server {
    listen 80;
    server_name poker.example.com;   # 替换为你的域名

    # 前端静态资源
    root /var/www/poker;
    index index.html;

    # 前端路由（history 模式）回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket（重要：必须带 Upgrade / Connection 头，并使用 http1.1）
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;    # 长连接，防 ws 中途被断
        proxy_send_timeout 3600s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

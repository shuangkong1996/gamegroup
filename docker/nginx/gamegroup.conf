# HTTP服务器配置 - 重定向到HTTPS
server {
    listen 80;
    server_name gamegroup.shuangkong.top;

    # 重定向所有HTTP请求到HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS服务器配置
server {
    listen 443 ssl;
    server_name gamegroup.shuangkong.top;

    # SSL证书配置（请根据实际证书路径修改）
    ssl_certificate cert/gamegroup.shuangkong.top.pem;
    ssl_certificate_key cert/gamegroup.shuangkong.top.key;

    # SSL配置优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 日志配置
    access_log /usr/local/nginx/logs/shuangkong.top.access.log;
    error_log /usr/local/nginx/logs/shuangkong.top.error.log;

    # 客户端最大请求体大小
    client_max_body_size 10M;

    # API代理配置 - 将 /api 路径代理到后端服务
    location /api {
        proxy_pass http://127.0.0.1:28011/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # 图片资源访问配置 - /images 路径
    location /images {
        alias /home/dr/docker/gamegroup/images;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # 只允许访问图片文件
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|bmp)$ {
            access_log off;
        }
        
        # 禁止访问其他文件类型
        location ~ \.(php|jsp|asp|sh|py|pl)$ {
            deny all;
        }
    }

    # 图片资源访问配置 - /image 路径（兼容）
    location /image {
        alias /home/dr/docker/gamegroup/images;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 健康检查端点（可选）
    location /health {
        proxy_pass http://127.0.0.1:28011/api/actuator/health;
        access_log off;
    }

    # 根路径配置（可根据需要修改）
    location / {
        # 可以配置静态文件或返回默认页面
        # 例如：root /var/www/shuangkong.top;
        # 或者：return 200 "Welcome to shuangkong.top";
        return 404;
    }
}

